services:
  # Backend — Docker Web Service
  - type: web
    name: passport-photo-backend
    runtime: docker
    dockerfilePath: ./passport-photo-backend/Dockerfile
    dockerContext: ./passport-photo-backend
    plan: free
    # healthCheckPath is a paid-plan feature; not supported on free tier
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # Fill in the frontend URL in the Render dashboard after first deploy

  # Frontend — Static Site (SPA)
  - type: web
    name: passport-photo-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: passport-photo-frontend
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false   # Fill in the backend URL in the Render dashboard after first deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
