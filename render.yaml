services:
  # Frontend — Static Site (SPA) — free on Render
  - type: web
    name: passport-photo-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: MyFirstClaude_project/passport-photo-frontend
    envVars:
      - key: VITE_API_URL
        sync: false   # Fill in the Railway backend URL in the Render dashboard after deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
